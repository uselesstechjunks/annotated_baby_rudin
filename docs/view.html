<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Notes</title>

  <link rel="stylesheet" href="style.css">

  <!--
    Configure MathJax before loading it.

    This enables both the familiar Markdown-style delimiters:

        $...$       inline mathematics
        $$...$$     display mathematics

    and the LaTeX delimiters:

        \(...\)     inline mathematics
        \[...\]     display mathematics
  -->

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ["$", "$"],
          ["\\(", "\\)"]
        ],
        displayMath: [
          ["$$", "$$"],
          ["\\[", "\\]"]
        ]
      }
    };
  </script>

  <!-- MathJax -->

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js">
  </script>

</head>

<body>

  <main id="content">
    <div class="status">Loading…</div>
  </main>

  <script type="module">

    /*
     * ------------------------------------------------------------
     * Configuration
     * ------------------------------------------------------------
     */

    const content = document.getElementById("content");


    /*
     * ------------------------------------------------------------
     * Determine which Markdown file to display
     * ------------------------------------------------------------
     *
     * Examples:
     *
     *   view.html
     *   view.html?file=chapter1.md
     *   view.html?file=chapter2.md
     */

    function getFileName() {
      const params = new URLSearchParams(window.location.search);

      return params.get("file") || "READLIST.md";
    }


    /*
     * ------------------------------------------------------------
     * Error handling
     * ------------------------------------------------------------
     */

    function showError(message, error = null) {

      console.error(message, error);

      content.innerHTML = "";

      const element = document.createElement("div");

      element.className = "error";

      element.textContent =
        error instanceof Error
          ? `${message}\n\n${error.message}`
          : message;

      content.appendChild(element);
    }


    /*
     * ------------------------------------------------------------
     * Load Marked
     * ------------------------------------------------------------
     *
     * Marked is loaded as an ES module rather than through a
     * separate <script> tag. This avoids script-order races.
     */

    async function loadMarked() {

      const module = await import(
        "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js"
      );

      return module.marked;
    }


    /*
     * ------------------------------------------------------------
     * Load Markdown
     * ------------------------------------------------------------
     */

    async function loadMarkdown(fileName) {

      const url =
        `content/${encodeURIComponent(fileName)}`;

      const response = await fetch(url);

      if (!response.ok) {

        throw new Error(
          `Could not load "${fileName}" ` +
          `(${response.status} ${response.statusText})`
        );
      }

      return response.text();
    }


    /*
     * ------------------------------------------------------------
     * Markdown → HTML
     * ------------------------------------------------------------
     */

    function renderMarkdown(marked, markdown) {

      return marked.parse(markdown, {
        gfm: true,
        breaks: false
      });
    }


    /*
     * ------------------------------------------------------------
     * MathJax
     * ------------------------------------------------------------
     *
     * MathJax 4 performs asynchronous startup work.
     *
     * Waiting for startup.promise guarantees that
     * typesetPromise is available before we call it.
     */

    async function typesetMath(element) {

      if (!window.MathJax) {

        throw new Error(
          "MathJax failed to load."
        );
      }


      if (window.MathJax.startup?.promise) {

        await window.MathJax.startup.promise;
      }


      if (
        typeof window.MathJax.typesetPromise !== "function"
      ) {

        throw new Error(
          "MathJax loaded, but typesetPromise is unavailable."
        );
      }


      await window.MathJax.typesetPromise([element]);
    }


    /*
     * ------------------------------------------------------------
     * Page title
     * ------------------------------------------------------------
     *
     * Use the first Markdown H1 as the browser tab title.
     */

    function updateTitle() {

      const heading =
        content.querySelector("h1");


      if (heading) {

        document.title =
          `${heading.textContent.trim()} — Notes`;
      }
    }


    /*
     * ------------------------------------------------------------
     * Back to contents navigation
     * ------------------------------------------------------------
     */

    function addContentsLink() {

      const nav =
        document.createElement("nav");

      nav.className =
        "chapter-nav";

      nav.setAttribute(
        "aria-label",
        "Chapter navigation"
      );


      const link =
        document.createElement("a");

      link.href = "index.html";

      link.textContent =
        "← Back to contents";


      nav.appendChild(link);

      content.appendChild(nav);
    }


    /*
     * ------------------------------------------------------------
     * Main rendering pipeline
     * ------------------------------------------------------------
     */

    async function main() {

      const fileName =
        getFileName();


      try {

        /*
         * Load Marked and the Markdown file in parallel.
         */

        const [marked, markdown] =
          await Promise.all([
            loadMarked(),
            loadMarkdown(fileName)
          ]);


        /*
         * Markdown → HTML
         */

        content.innerHTML =
          renderMarkdown(marked, markdown);


        /*
         * Update browser title from the H1.
         */

        updateTitle();


        /*
         * HTML → rendered mathematics
         */

        await typesetMath(content);


        /*
         * Add navigation after the chapter content.
         *
         * This means the link appears at the very bottom
         * of every chapter automatically.
         */

        addContentsLink();

      } catch (error) {

        showError(
          `Unable to render "${fileName}".`,
          error
        );
      }
    }


    /*
     * Start rendering.
     */

    main();

  </script>

</body>
</html>
