<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Notes</title>

  <link rel="stylesheet" href="style.css">

  <!-- MathJax -->

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ["$", "$"],
          ["\\(", "\\)"]
        ],
        displayMath: [
          ["$$", "$$"],
          ["\\[", "\\]"]
        ]
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js">
  </script>

</head>

<body>
  <main id="content">
    <div class="status">Loading…</div>
  </main>

  <script type="module">
    const content = document.getElementById("content");

    function getFileName() {
      const params = new URLSearchParams(window.location.search);
      return params.get("file") || "READLIST.md";
    }

    function showError(message, error = null) {
      console.error(message, error);

      content.innerHTML = "";

      const element = document.createElement("div");
      element.className = "error";

      element.textContent =
        error instanceof Error
          ? `${message}\n\n${error.message}`
          : message;

      content.appendChild(element);
    }

    async function loadMarked() {
      /*
       * Load marked directly as an ES module.
       *
       * This avoids relying on a separate <script> tag having
       * initialized window.marked before our code runs.
       */
      const module = await import(
        "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js"
      );

      return module.marked;
    }

    async function loadMarkdown(fileName) {
      const url = `content/${encodeURIComponent(fileName)}`;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          `Could not load "${fileName}" (${response.status} ${response.statusText})`
        );
      }

      return response.text();
    }

    function renderMarkdown(marked, markdown) {
      return marked.parse(markdown, {
        gfm: true,
        breaks: false
      });
    }

    async function typesetMath(element) {
      if (!window.MathJax) {
        throw new Error("MathJax failed to load.");
      }

      /*
       * MathJax 4 performs some initialization asynchronously.
       * Wait for it before asking it to typeset the page.
       */
      if (window.MathJax.startup?.promise) {
        await window.MathJax.startup.promise;
      }

      if (typeof window.MathJax.typesetPromise !== "function") {
        throw new Error(
          "MathJax loaded, but typesetPromise is unavailable."
        );
      }

      await window.MathJax.typesetPromise([element]);
    }

    function updateTitle() {
      const heading = content.querySelector("h1");

      if (heading) {
        document.title = `${heading.textContent.trim()} — Notes`;
      }
    }

    async function main() {
      const fileName = getFileName();

      try {
        /*
         * Load both dependencies and the Markdown.
         */
        const [marked, markdown] = await Promise.all([
          loadMarked(),
          loadMarkdown(fileName)
        ]);

        /*
         * Convert Markdown → HTML.
         */
        content.innerHTML = renderMarkdown(marked, markdown);

        updateTitle();

        /*
         * HTML → rendered mathematics.
         */
        await typesetMath(content);

      } catch (error) {
        showError(
          `Unable to render "${fileName}".`,
          error
        );
      }
    }

    main();
  </script>

</body>
</html>
