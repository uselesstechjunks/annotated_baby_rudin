<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ["$", "$"],
          ["\\(", "\\)"]
        ],
        displayMath: [
          ["$$", "$$"],
          ["\\[", "\\]"]
        ]
      }
    };
  </script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js">
  </script>
</head>
<body>
  <button
    id="theme-toggle"
    class="theme-toggle"
    type="button"
    aria-label="Switch to light mode"
  >
    ☀ Light
  </button>
  
  <main id="content">
    <div class="status">Loading…</div>
  </main>

  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") {
      document.documentElement.classList.add("light");
    }
    const themeToggle = document.getElementById("theme-toggle");
    function updateThemeButton() {
      const isLight = document.documentElement.classList.contains("light");
      themeToggle.textContent = isLight ? "☾ Dark" : "☀ Light";
      themeToggle.setAttribute(
        "aria-label",
        isLight ? "Switch to dark mode" : "Switch to light mode"
      );
    }
    updateThemeButton();
    themeToggle.addEventListener("click", () => {
      const isLight = document.documentElement.classList.toggle("light");
      localStorage.setItem("theme", isLight ? "light" : "dark");
      updateThemeButton();
    });
  </script>

  <script type="module">
    const content = document.getElementById("content");
    /*
     * Get the Markdown file from the URL.
     *
     * Example:
     *
     * view.html?file=chapter1.md
     */
    function getFileName() {
      const params = new URLSearchParams(window.location.search);
      return params.get("file") || "READLIST.md";
    }

    /*
     * Display an error on the page.
     */
    function showError(message, error = null) {
      console.error(message, error);
      content.innerHTML = "";
      const element = document.createElement("div");
      element.className = "error";
      element.textContent =
        error instanceof Error
          ? `${message}\n\n${error.message}`
          : message;
      content.appendChild(element);
    }

    /*
     * Load Marked as an ES module.
     */

    async function loadMarked() {
      const module = await import(
        "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js"
      );
      return module.marked;
    }

    /*
     * Load the Markdown file.
     */
    async function loadMarkdown(fileName) {
      const url =
        `content/${encodeURIComponent(fileName)}`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(
          `Could not load "${fileName}" ` +
          `(${response.status} ${response.statusText})`
        );
      }
      return response.text();
    }

    /*
     * Convert Markdown to HTML.
     */
    function renderMarkdown(marked, markdown) {
      return marked.parse(markdown, {
        gfm: true,
        breaks: false
      });
    }

    /*
     * Wait for MathJax and typeset the page.
     */
    async function typesetMath(element) {
      if (!window.MathJax) {
        throw new Error("MathJax failed to load.");
      }
      if (window.MathJax.startup?.promise) {
        await window.MathJax.startup.promise;
      }
      if (
        typeof window.MathJax.typesetPromise !== "function"
      ) {
        throw new Error(
          "MathJax loaded, but typesetPromise is unavailable."
        );
      }
      await window.MathJax.typesetPromise([element]);
    }

    /*
     * Set the browser tab title from the first H1.
     */
    function updateTitle() {
      const heading =
        content.querySelector("h1");
      if (heading) {
        document.title =
          `${heading.textContent.trim()} — Notes`;
      }
    }

    /*
     * Add the "Back to contents" link.
     */
    function addContentsLink() {
      const nav =
        document.createElement("nav");
      nav.className = "chapter-nav";
      nav.setAttribute(
        "aria-label",
        "Chapter navigation"
      );
      const link =
        document.createElement("a");
      link.href = "index.html";
      link.textContent =
        "← Back to contents";
      nav.appendChild(link);
      content.appendChild(nav);
    }

    /*
     * Main rendering pipeline.
     */
    async function main() {
      const fileName =
        getFileName();
      try {
        const [marked, markdown] =
          await Promise.all([
            loadMarked(),
            loadMarkdown(fileName)
          ]);
        /*
         * Markdown → HTML
         */
        content.innerHTML =
          renderMarkdown(marked, markdown);
        /*
         * Update page title.
         */
        updateTitle();
        /*
         * Add navigation AFTER the chapter
         * has been rendered.
         */
        addContentsLink();
        /*
         * HTML → MathJax
         */
        await typesetMath(content);
      } catch (error) {
        showError(
          `Unable to render "${fileName}".`,
          error
        );
      }
    }
    main();
  </script>
</body>
</html>
