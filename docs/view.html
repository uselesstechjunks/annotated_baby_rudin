<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Notes</title>

  <style>
    :root {
      --content-width: 900px;
      --text: #222;
      --muted: #666;
      --border: #ddd;
      --code-bg: #f6f6f6;
      --link: #0645ad;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 2rem 1rem 4rem;
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      background: #fff;
    }

    main {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    a {
      color: var(--link);
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.25;
      margin-top: 1.8em;
    }

    h1 {
      margin-top: 0;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    pre {
      overflow-x: auto;
      padding: 1rem;
      border-radius: 6px;
      background: var(--code-bg);
      border: 1px solid var(--border);
    }

    code {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    :not(pre) > code {
      padding: 0.15em 0.3em;
      border-radius: 3px;
      background: var(--code-bg);
    }

    blockquote {
      margin-left: 0;
      padding-left: 1rem;
      border-left: 4px solid var(--border);
      color: var(--muted);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
    }

    th,
    td {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    th {
      background: var(--code-bg);
    }

    .status {
      color: var(--muted);
      padding: 2rem 0;
    }

    .error {
      color: #900;
      padding: 1rem;
      border: 1px solid #d99;
      background: #fee;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>

  <!--
    MathJax must be loaded before the script which uses it.
    Both scripts are deferred, so they execute in document order.
  -->

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js">
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js">
  </script>

</head>

<body>
  <main id="content">
    <div class="status">Loading…</div>
  </main>

  <!--
    A deferred external script is used here deliberately.

    This guarantees that:
      1. MathJax has been loaded
      2. marked has been loaded
      3. this script runs afterwards
  -->

  <script defer>
    (() => {
      "use strict";

      const content = document.getElementById("content");

      function getFileName() {
        const params = new URLSearchParams(window.location.search);
        return params.get("file") || "READLIST.md";
      }

      function showError(message, error = null) {
        console.error(message, error);

        content.innerHTML = "";

        const element = document.createElement("div");
        element.className = "error";
        element.textContent =
          error instanceof Error
            ? `${message}\n\n${error.message}`
            : message;

        content.appendChild(element);
      }

      async function loadMarkdown(fileName) {
        /*
         * The content directory is relative to view.html.
         *
         * encodeURIComponent prevents a query parameter from turning
         * into an unintended path such as ../../something.
         */
        const url = `content/${encodeURIComponent(fileName)}`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            `Could not load "${fileName}" (${response.status} ${response.statusText})`
          );
        }

        return response.text();
      }

      function renderMarkdown(markdown) {
        /*
         * marked is loaded from the UMD build above.
         */
        if (!window.marked || typeof window.marked.parse !== "function") {
          throw new Error("Marked.js failed to load.");
        }

        /*
         * Parse Markdown normally.
         *
         * We deliberately do NOT manipulate $$...$$ here.
         * MathJax should receive the original TeX delimiters.
         */
        return window.marked.parse(markdown, {
          gfm: true,
          breaks: false
        });
      }

      async function typesetMath(element) {
        if (!window.MathJax) {
          throw new Error("MathJax failed to load.");
        }

        /*
         * MathJax 4 loads some of its components asynchronously.
         * Waiting for startup.promise makes this robust even when
         * fonts/extensions have not finished loading yet.
         */
        if (window.MathJax.startup?.promise) {
          await window.MathJax.startup.promise;
        }

        if (typeof window.MathJax.typesetPromise !== "function") {
          throw new Error(
            "MathJax loaded, but typesetPromise is unavailable."
          );
        }

        await window.MathJax.typesetPromise([element]);
      }

      function updateTitle() {
        const heading = content.querySelector("h1");

        if (heading) {
          document.title = `${heading.textContent.trim()} — Notes`;
        }
      }

      async function main() {
        const fileName = getFileName();

        try {
          const markdown = await loadMarkdown(fileName);

          content.innerHTML = renderMarkdown(markdown);

          updateTitle();

          await typesetMath(content);
        } catch (error) {
          showError(`Unable to render "${fileName}".`, error);
        }
      }

      main();
    })();
  </script>

</body>
</html>
